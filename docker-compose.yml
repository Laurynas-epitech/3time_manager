services:
  db:
    image: postgres:16-alpine
    container_name: time_manager_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: time_manager_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: time_manager_backend
    depends_on:
      - db
    ports:
      - "4000:4000"
    environment:
      MIX_ENV: dev

  frontend:
    build:
      context: ./frontend
    container_name: time_manager_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data: