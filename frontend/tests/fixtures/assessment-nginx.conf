# Local assessment only: HTTP intentionally enabled for the interception comparison.
server {
    listen 5173;
    listen 8443 ssl;
    ssl_certificate /etc/nginx/assessment-certs/cert.pem;
    ssl_certificate_key /etc/nginx/assessment-certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1000000;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /sw.js {
        add_header Cache-Control no-cache;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
