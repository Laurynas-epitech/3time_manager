server {
    listen 80;
    server_name 57.130.61.152;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/time-manager-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://57.130.61.152$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 57.130.61.152;
    ssl_certificate /etc/letsencrypt/live/time-manager/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/time-manager/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TimeManagerTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        # Browser hardening for the web app (the API sets its own headers).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
