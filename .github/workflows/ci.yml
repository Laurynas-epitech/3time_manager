name: Time Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test pagination and reporting
        run: npm run test:security && npm run test:reporting


  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: time_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      MIX_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27'

      - name: Install dependencies
        run: mix deps.get

      - name: Compile backend
        run: mix compile

      - name: Run tests
        run: mix precommit


  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t time-manager-frontend ./frontend

      - name: Build backend Docker image
        run: docker build -t time-manager-backend ./backend

      - name: Publish release images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for service in frontend backend; do
            docker tag "time-manager-$service" "$image_root-$service:$GITHUB_SHA"
            docker push "$image_root-$service:$GITHUB_SHA"
          done

  deploy:
    name: Roll out main after successful checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale release
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Prepare release bundle
        run: git archive --format=tar.gz -o release.tar.gz HEAD
      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for setting in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY KNOWN_HOSTS; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing deployment setting: $setting"
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo '::error::DEPLOY_HOST must be a plain IPv4 address or DNS hostname, without URL scheme, username, port or whitespace.'
            exit 1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo '::error::DEPLOY_USER must contain only the SSH account name.'
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          target="/tmp/time-manager-$GITHUB_SHA.tar.gz"
          scp -i ~/.ssh/deploy release.tar.gz "$remote:$target"
          ssh -i ~/.ssh/deploy "$remote" "sudo /usr/local/sbin/time-manager-deploy '$target' '$GITHUB_SHA' 'ghcr.io/${GITHUB_REPOSITORY,,}'"
